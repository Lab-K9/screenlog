name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt

      - name: Test
        run: |
          venv/bin/python -m unittest discover -v
          venv/bin/python -m compileall screenlog

      - name: Script syntax
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/install-local-app.sh
          bash -n scripts/install-launch-agent.sh
          bash -n scripts/uninstall-launch-agent.sh
          bash -n scripts/start-background.sh
          bash -n scripts/stop.sh
          bash -n scripts/uninstall.sh

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/ScreenLog.app
